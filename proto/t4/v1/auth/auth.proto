syntax = "proto3";
package t4proto.v1.auth;

import "google/protobuf/timestamp.proto";
import "t4/v1/common/enums.proto";

message LoginRequest {
  // API Key authentication (use this OR username/password, not both)
  optional string api_key = 1;

  // Username/password authentication
  optional string firm = 2;
  optional string username = 3;
  optional string password = 4;
  optional string app_name = 5;
  optional string app_license = 6;
}

message LoginResponse {
  t4proto.v1.common.LoginResult result = 1;
  string session_id = 2;
  string user_id = 3;
  string firm_id = 4;
  repeated string roles = 5;
  repeated Exchange exchanges = 6;
  repeated Account accounts = 7;
  optional string server = 8;
  optional string brand = 9;
  optional AuthenticationToken authentication_token = 10;
}

message Exchange {
  string exchange_id = 1;
  bool market_data = 2;
  bool order_routing = 3;
  repeated string markets = 4;
}

message Account {
  string account_id = 1;
  string display_name = 2;
  t4proto.v1.common.AccountMode mode = 3;
}

message AuthenticationTokenRequest {
  string session_id = 1;
}

message AuthenticationToken {
  string token = 1;
  google.protobuf.Timestamp expiry = 2;
  string request_id = 3;
  string failure_message = 4;
}
